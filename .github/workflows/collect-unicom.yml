name: Collect carrier procurement notices

on:
  schedule:
    - cron: "15 0,4,8 * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: collect-carrier-notices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decision.outputs.should_run }}
    steps:
      - id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_SCHEDULE" = "15 0,4,8 * * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESULT=$(curl --fail --silent --show-error "https://huadong-caigou-radar.pages.dev/api/refresh-needed")
          echo "$RESULT" | grep -q '"shouldRun":true' && echo "should_run=true" >> "$GITHUB_OUTPUT" || echo "should_run=false" >> "$GITHUB_OUTPUT"

  collect:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: npm run collect:mobile
      - run: npm run collect:unicom
      - run: npm run collect:tower
      - run: npm run collect:telecom
      - name: Request upload identity
        id: oidc
        run: |
          TOKEN=$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=huadong-caigou-radar" | jq -r .value)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Sync archives to website
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          for SOURCE in mobile unicom tower telecom; do
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@public/data/${SOURCE}-notices.json" \
              "https://huadong-caigou-radar.pages.dev/api/archive-sync?source=${SOURCE}"
          done
