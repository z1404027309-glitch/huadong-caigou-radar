name: Collect carrier procurement notices

on:
  schedule:
    # Beijing time: 08:15, 12:15 and 16:15.
    - cron: "15 0,4,8 * * *"
    # Beijing time: 21:00 and 23:00.
    - cron: "0 13,15 * * *"
    # Poll refresh requests every five minutes, excluding minutes 00 and 15
    # so a polling event can never overlap a forced collection event.
    - cron: "5-10/5,20-55/5 * * * *"
  workflow_dispatch:
    inputs:
      mobile_pilot:
        description: Backfill recent Fujian Mobile inquiry notices only
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: collect-carrier-notices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decision.outputs.should_run }}
    steps:
      - id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             [ "$EVENT_SCHEDULE" = "15 0,4,8 * * *" ] || \
             [ "$EVENT_SCHEDULE" = "0 13,15 * * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if RESULT=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            "https://huadong-caigou-radar.pages.dev/api/refresh-needed"); then
            echo "$RESULT" | grep -q '"shouldRun":true' && echo "should_run=true" >> "$GITHUB_OUTPUT" || echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Refresh check endpoint is unavailable; running collection as a safe fallback"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  collect_unicom:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: windows-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Collect China Unicom in system Edge
        id: unicom
        if: inputs.mobile_pilot != true
        continue-on-error: true
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path -LiteralPath $edge)) { throw "Microsoft Edge is unavailable" }
          $profile = Join-Path $env:RUNNER_TEMP "unicom-edge-profile"
          $process = Start-Process -FilePath $edge -WindowStyle Hidden -PassThru -ArgumentList @(
            "--remote-debugging-port=9222",
            "--user-data-dir=$profile",
            "--no-first-run",
            "--no-default-browser-check",
            "about:blank"
          )
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                Invoke-RestMethod -Uri "http://127.0.0.1:9222/json/version" | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "Edge remote debugging endpoint did not start" }
            $env:UNICOM_CDP_ENDPOINT = "http://127.0.0.1:9222"
            npm run collect:unicom
            node scripts/validate-publication-source.mjs unicom
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Record China Unicom result
        id: result
        if: always()
        shell: pwsh
        run: '"status=${{ steps.unicom.outcome }}" >> $env:GITHUB_OUTPUT'
      - name: Preserve China Unicom archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unicom-notice-archive
          path: public/data/unicom-notices.json
          if-no-files-found: error
          retention-days: 1

  collect:
    needs: [check, collect_unicom]
    if: always() && needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore China Unicom archive
        uses: actions/download-artifact@v4
        with:
          name: unicom-notice-archive
          path: public/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Install Mobile PDF OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-chi-sim
      - run: npx playwright install --with-deps chromium
      - name: Collect China Mobile
        id: mobile
        continue-on-error: true
        env:
          MOBILE_BACKFILL_PROVINCE: ${{ inputs.mobile_pilot == true && '福建' || '' }}
          MOBILE_BACKFILL_DAYS: ${{ inputs.mobile_pilot == true && '31' || '0' }}
          MOBILE_BACKFILL_TITLE: ${{ inputs.mobile_pilot == true && '询比' || '' }}
        run: |
          for ATTEMPT in 1 2 3; do
            echo "China Mobile collector attempt ${ATTEMPT}/3"
            npm run collect:mobile && npm run recognize:mobile:browser && node scripts/validate-publication-source.mjs mobile && exit 0
            [ "$ATTEMPT" = "3" ] && exit 1
            sleep $((ATTEMPT * 20))
          done
      - name: Collect China Tower
        if: inputs.mobile_pilot != true
        id: tower
        continue-on-error: true
        run: npm run collect:tower && node scripts/validate-publication-source.mjs tower
      - name: Collect China Telecom
        if: inputs.mobile_pilot != true
        id: telecom
        continue-on-error: true
        run: npm run collect:telecom && node scripts/validate-publication-source.mjs telecom
      - name: Request upload identity
        id: oidc
        if: always()
        run: |
          TOKEN=$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=huadong-caigou-radar" | jq -r .value)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Prepare a complete publication batch
        id: prepare_batch
        if: always() && steps.oidc.outcome == 'success'
        env:
          MOBILE_STATUS: ${{ steps.mobile.outcome }}
          UNICOM_STATUS: ${{ needs.collect_unicom.outputs.status }}
          TOWER_STATUS: ${{ steps.tower.outcome }}
          TELECOM_STATUS: ${{ steps.telecom.outcome }}
        run: |
          for SOURCE in mobile unicom tower telecom; do
            STATUS_VAR=$(echo "${SOURCE}_STATUS" | tr '[:lower:]' '[:upper:]')
            STATUS=$(printenv "$STATUS_VAR")
            ARCHIVE="public/data/${SOURCE}-notices.json"
            if [ "$STATUS" != "success" ]; then
              echo "${SOURCE} collector status is ${STATUS}; keeping the last published archive"
              git restore --source=HEAD --worktree -- "$ARCHIVE"
            fi
            node scripts/validate-publication-source.mjs "$SOURCE"
          done
      - name: Sync complete batch to website
        id: sync_website
        if: always() && steps.oidc.outcome == 'success' && steps.prepare_batch.outcome == 'success'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          BATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for SOURCE in mobile unicom tower telecom; do
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@public/data/${SOURCE}-notices.json" \
              "https://huadong-caigou.z1404027309.chatgpt.site/api/archive-sync?source=${SOURCE}&batch=${BATCH_ID}"
          done
      - name: Complete website publication batch
        id: complete_website
        if: always() && steps.oidc.outcome == 'success' && steps.sync_website.outcome == 'success'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          BATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          jq -n \
            --arg batchId "$BATCH_ID" \
            '{batchId:$batchId,mobile:"success",unicom:"success",tower:"success",telecom:"success"}' | \
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "https://huadong-caigou.z1404027309.chatgpt.site/api/refresh-finish"
      - name: Publish completed archives to enterprise WeChat endpoint
        if: always() && steps.oidc.outcome == 'success' && steps.prepare_batch.outcome == 'success' && steps.complete_website.outcome == 'success'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          BATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          MOBILE_STATUS: ${{ steps.mobile.outcome }}
          UNICOM_STATUS: ${{ needs.collect_unicom.outputs.status }}
          TOWER_STATUS: ${{ steps.tower.outcome }}
          TELECOM_STATUS: ${{ steps.telecom.outcome }}
        run: |
          for SOURCE in mobile unicom tower telecom; do
            STATUS_VAR=$(echo "${SOURCE}_STATUS" | tr '[:lower:]' '[:upper:]')
            STATUS=$(printenv "$STATUS_VAR")
            if [ "$STATUS" = "success" ]; then
              curl --fail --silent --show-error \
                -X POST \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary "@public/data/${SOURCE}-notices.json" \
                "https://huadong-caigou-radar.pages.dev/api/archive-sync?source=${SOURCE}&batch=${BATCH_ID}"
            else
              echo "Reusing current production archive for ${SOURCE}: collector status is ${STATUS}"
            fi
          done
          jq -n \
            --arg batchId "$BATCH_ID" \
            --arg mobile "$MOBILE_STATUS" \
            --arg unicom "$UNICOM_STATUS" \
            --arg tower "$TOWER_STATUS" \
            --arg telecom "$TELECOM_STATUS" \
            '{batchId:$batchId,mobile:$mobile,unicom:$unicom,tower:$tower,telecom:$telecom}' | \
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "https://huadong-caigou-radar.pages.dev/api/refresh-finish"
